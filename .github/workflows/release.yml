name: 发布 Windows 版本

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        # 不传 version，自动从 package.json 的 packageManager 字段读取，避免版本冲突
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 类型检查
        run: pnpm run typecheck
      - name: 构建安装包与压缩包
        run: pnpm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 生成 SHA-256 校验文件
        shell: pwsh
        run: |
          $lines = Get-ChildItem -LiteralPath release -File |
            Where-Object { $_.Extension -in '.exe', '.zip' } |
            Sort-Object Name |
            ForEach-Object { "$( (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() )  $($_.Name)" }
          $lines | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding ascii
      - name: 发布版本文件
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
      - name: 保存手动构建产物
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: TrmWrite-Windows
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
